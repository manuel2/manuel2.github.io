<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Schedule .ics Generator</title>

  <style>
    :root {
      color-scheme: light dark;

      --bg: light-dark(#f7f9fc, #101318);
      --surface: light-dark(#ffffff, #181c22);
      --surface-soft: light-dark(#f1f4f8, #20252d);
      --text: light-dark(#17202a, #eef2f7);
      --muted: light-dark(#66717e, #aab4c0);
      --border: light-dark(#dbe1e8, #343b46);

      --primary: light-dark(#3157c8, #8ea8ff);
      --primary-strong: light-dark(#2447ae, #aec0ff);
      --primary-contrast: light-dark(#ffffff, #101318);

      --shadow:
        light-dark(
          0 10px 30px rgba(23, 32, 42, .08),
          0 10px 30px rgba(0, 0, 0, .24)
        );

      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: var(--bg);
      color: var(--text);

      -webkit-font-smoothing: antialiased;
    }

    #app {
      min-height: 100vh;
      background: var(--bg);
      border-radius: 0;
    }

    /* -----------------------------
       Header
       ----------------------------- */

    header {
      height: 64px;

      display: flex;
      align-items: center;

      border-bottom: 1px solid var(--border);

      background:
        color-mix(
          in srgb,
          var(--surface) 92%,
          transparent
        );
    }

    .header-inner {
      width: min(100% - 40px, 1040px);
      margin: 0 auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;

      font-size: 17px;
      font-weight: 650;
      letter-spacing: -.01em;
    }

    .brand-mark {
      width: 30px;
      height: 30px;

      display: grid;
      place-items: center;

      border-radius: 9px;

      background: var(--primary);
      color: var(--primary-contrast);

      font-size: 13px;
      font-weight: 800;
      letter-spacing: -.04em;
    }

    /* -----------------------------
       Main content
       ----------------------------- */

    .main {
      width: min(100% - 40px, 760px);
      margin: 0 auto;

      padding: 76px 0 72px;
    }

    .intro {
      max-width: 610px;
      margin: 0 auto 34px;

      text-align: center;
    }

    h1 {
      margin: 0 0 12px;

      font-size: clamp(28px, 5vw, 40px);
      line-height: 1.15;

      letter-spacing: -.035em;
      font-weight: 720;
    }

    .intro p {
      margin: 0;

      color: var(--muted);

      font-size: 15px;
      line-height: 1.65;
    }

    /* -----------------------------
       Upload card
       ----------------------------- */

    .upload-card {
      padding: 22px;

      background: var(--surface);

      border: 1px solid var(--border);
      border-radius: var(--radius);

      box-shadow: var(--shadow);
    }

    .drop-zone {
      min-height: 280px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px 20px;

      border: 1.5px dashed var(--border);
      border-radius: 12px;

      background: var(--surface-soft);

      text-align: center;

      cursor: pointer;

      transition:
        border-color .18s ease,
        background .18s ease,
        transform .18s ease;
    }

    .drop-zone:hover,
    .drop-zone:focus-visible,
    .drop-zone.is-dragging {
      border-color: var(--primary);

      background:
        color-mix(
          in srgb,
          var(--primary) 8%,
          var(--surface-soft)
        );

      outline: none;
    }

    .drop-zone.is-dragging {
      transform: scale(1.005);
    }

    .upload-content {
      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 13px;
    }

    /* -----------------------------
       Upload icon
       ----------------------------- */

    .upload-icon {
      width: 52px;
      height: 52px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      background:
        color-mix(
          in srgb,
          var(--primary) 12%,
          var(--surface)
        );

      color: var(--primary);
    }

    .upload-icon svg {
      width: 25px;
      height: 25px;
    }

    /* -----------------------------
       Upload text
       ----------------------------- */

    .drop-title {
      margin: 0;

      font-size: 16px;
      font-weight: 650;
    }

    .drop-subtitle {
      margin: -5px 0 2px;

      color: var(--muted);

      font-size: 13px;
    }

    /* -----------------------------
       Browse button
       ----------------------------- */

    .browse-button {
      border: 0;
      border-radius: 9px;

      padding: 10px 18px;

      background: var(--primary);
      color: var(--primary-contrast);

      font: inherit;
      font-size: 14px;
      font-weight: 650;

      cursor: pointer;

      box-shadow:
        0 2px 6px
        color-mix(
          in srgb,
          var(--primary) 22%,
          transparent
        );

      transition:
        background .18s ease,
        transform .18s ease;
    }

    .browse-button:hover {
      background: var(--primary-strong);
    }

    .browse-button:active {
      transform: translateY(1px);
    }

    /* -----------------------------
       File note
       ----------------------------- */

    .file-note {
      margin: 15px 2px 0;

      color: var(--muted);

      font-size: 12px;
      text-align: center;
    }

    /* -----------------------------
       Footer
       ----------------------------- */

    footer {
      width: min(100% - 40px, 1040px);
      margin: 0 auto;

      padding: 0 0 28px;

      color: var(--muted);

      font-size: 12px;
      text-align: center;
    }

    /* Hide the actual file input.
       The custom upload area triggers it. */

    #fileInput {
      display: none;
    }

    /* -----------------------------
       Mobile
       ----------------------------- */

    @media (max-width: 600px) {

      .header-inner,
      footer {
        width: min(100% - 28px, 1040px);
      }

      .main {
        width: min(100% - 28px, 760px);

        padding: 54px 0 56px;
      }

      .upload-card {
        padding: 14px;
      }

      .drop-zone {
        min-height: 250px;
      }
    }
  </style>
</head>

<body>

  <div id="app">

    <!-- =========================
         HEADER
         ========================= -->

    <header>
      <div class="header-inner">

        <div
          class="brand"
          aria-label="Schedul .ical Generator"
        >

          <span class="brand-mark">
            S.
          </span>

          <span>
            Schedule .ics Generator
          </span>

        </div>

      </div>
    </header>


    <!-- =========================
         MAIN CONTENT
         ========================= -->

    <main class="main">

      <!-- Introduction -->

      <section
        class="intro"
        aria-labelledby="page-title"
      >

        <h1 id="page-title">
          Generate your .ical file
        </h1>

        <p>
          Upload the schedule CSV file to prepare it
          for .ical generation. Choose a file below
          or drop it into the upload area.
        </p>

      </section>


      <!-- Upload area -->

      <section
        class="upload-card"
        aria-label="CSV file upload"
      >

        <!-- Actual browser file selector -->

        <input
          id="fileInput"
          type="file"
          accept=".csv,text/csv"
        >


        <!-- Drag & drop area -->

        <div
          id="dropZone"
          class="drop-zone"
          role="button"
          tabindex="0"
          aria-label="Drop a CSV file here or browse for one"
        >

          <div class="upload-content">

            <!-- Upload icon -->

            <div
              class="upload-icon"
              aria-hidden="true"
            >

              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >

                <path d="M12 16V4"></path>

                <path
                  d="m7.5 8.5 4.5-4.5 4.5 4.5"
                ></path>

                <path
                  d="M5 14.5v3A2.5 2.5 0 0 0 7.5 20h9a2.5 2.5 0 0 0 2.5-2.5v-3"
                ></path>

              </svg>

            </div>


            <!-- Upload text -->

            <p class="drop-title">
              Drop your CSV file here
            </p>

            <p class="drop-subtitle">
              or select a file from your device
            </p>


            <!-- Browse button -->

            <button
              id="browseButton"
              class="browse-button"
              type="button"
            >
              Browse files
            </button>

          </div>

        </div>


        <!-- File type information -->

        <p class="file-note">
          CSV files only
        </p>

      </section>

    </main>


    <!-- =========================
         FOOTER
         ========================= -->

    <footer>
      Schedul · Internal tool
    </footer>

  </div>


  <!-- =========================
       JAVASCRIPT
       ========================= -->

  <script>

    /*
     * Get references to the important elements.
     */

    const fileInput =
      document.getElementById('fileInput');

    const dropZone =
      document.getElementById('dropZone');

    const browseButton =
      document.getElementById('browseButton');


    /*
     * Browse button
     *
     * Clicking the custom button opens
     * the browser's file selector.
     */

    browseButton.addEventListener(
      'click',
      (event) => {

        event.stopPropagation();

        fileInput.click();

      }
    );


    /*
     * Clicking anywhere inside the drop zone
     * also opens the file selector.
     */

    dropZone.addEventListener(
      'click',
      () => {

        fileInput.click();

      }
    );


    /*
     * Keyboard accessibility.
     *
     * Enter or Space while the drop zone
     * is focused opens the file selector.
     */

    dropZone.addEventListener(
      'keydown',
      (event) => {

        if (
          event.key === 'Enter' ||
          event.key === ' '
        ) {

          event.preventDefault();

          fileInput.click();

        }

      }
    );


    /*
     * Dragging a file over the drop zone.
     */

    ['dragenter', 'dragover'].forEach(
      (type) => {

        dropZone.addEventListener(
          type,
          (event) => {

            event.preventDefault();

            dropZone.classList.add(
              'is-dragging'
            );

          }
        );

      }
    );


    /*
     * Remove the visual drag state when
     * the file leaves the area or is dropped.
     */

    ['dragleave', 'drop'].forEach(
      (type) => {

        dropZone.addEventListener(
          type,
          (event) => {

            event.preventDefault();

            dropZone.classList.remove(
              'is-dragging'
            );

          }
        );

      }
    );


    /*
     * Handle a file dropped onto the zone.
     */

    dropZone.addEventListener(
      'drop',
      (event) => {

        const files =
          event.dataTransfer.files;

        if (files.length) {

          handleFile(files[0]);

        }

      }
    );


    /*
     * Handle a file selected through
     * the normal browser file picker.
     */

    fileInput.addEventListener(
      'change',
      (event) => {

        if (event.target.files.length) {

          handleFile(
            event.target.files[0]
          );

        }

      }
    );


    /*
     * File handler.
     *
     * At this stage we only verify that
     * the selected file is a CSV.
     *
     * The actual CSV parsing and .ical
     * generation will be added in the
     * next development step.
     */

    function handleFile(file) {

      if (
        !file.name
          .toLowerCase()
          .endsWith('.csv')
      ) {

        alert(
          'Please select a CSV file.'
        );

        return;
      }


      /*
       * Placeholder for the next stage:
       *
       * 1. Read CSV
       * 2. Parse CSV
       * 3. Extract data
       * 4. Transform data
       * 5. Generate .ical
       * 6. Download .ical
       */

      console.log(
        'Selected CSV:',
        file.name,
        file.size,
        'bytes'
      );

    }

  </script>

</body>
</html>
